<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TutorMate - 과외 관리 시스템</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Day.js for Date Handling -->
    <script src="https://unpkg.com/dayjs@1.11.10/dayjs.min.js"></script>
    <script src="https://unpkg.com/dayjs@1.11.10/locale/ko.js"></script>
    <script src="https://unpkg.com/dayjs@1.11.10/plugin/isToday.js"></script>
    <script src="https://unpkg.com/dayjs@1.11.10/plugin/isSameOrBefore.js"></script>
    <script src="https://unpkg.com/dayjs@1.11.10/plugin/isSameOrAfter.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-neutral-50 text-neutral-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Initialize Day.js
        dayjs.locale('ko');
        dayjs.extend(window.dayjs_plugin_isToday);
        dayjs.extend(window.dayjs_plugin_isSameOrBefore);
        dayjs.extend(window.dayjs_plugin_isSameOrAfter);

        // --- Constants ---
        const COLORS = [
            { color: "bg-blue-100", borderColor: "border-blue-200", textColor: "text-blue-700" },
            { color: "bg-emerald-100", borderColor: "border-emerald-200", textColor: "text-emerald-700" },
            { color: "bg-amber-100", borderColor: "border-amber-200", textColor: "text-amber-700" },
            { color: "bg-rose-100", borderColor: "border-rose-200", textColor: "text-rose-700" },
            { color: "bg-indigo-100", borderColor: "border-indigo-200", textColor: "text-indigo-700" },
            { color: "bg-violet-100", borderColor: "border-violet-200", textColor: "text-violet-700" },
        ];

        // --- Components ---

        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const Modal = ({ isOpen, onClose, title, children, footer }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
                    <div className="bg-white rounded-3xl w-full max-w-md overflow-hidden shadow-2xl animate-in fade-in zoom-in duration-200">
                        <div className="px-6 py-4 border-b border-neutral-100 flex items-center justify-between">
                            <h3 className="text-lg font-bold">{title}</h3>
                            <button onClick={onClose} className="text-neutral-400 hover:text-neutral-600">
                                <Icon name="x" size={20} />
                            </button>
                        </div>
                        <div className="p-6">{children}</div>
                        {footer && <div className="px-6 py-4 bg-neutral-50 border-t border-neutral-100">{footer}</div>}
                    </div>
                </div>
            );
        };

        const Badge = ({ children, className = "" }) => (
            <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${className}`}>
                {children}
            </span>
        );

        // --- Main App ---

        function App() {
            const [students, setStudents] = useState(() => JSON.parse(localStorage.getItem("tm_students") || "[]"));
            const [lessons, setLessons] = useState(() => JSON.parse(localStorage.getItem("tm_lessons") || "[]"));
            const [homeworks, setHomeworks] = useState(() => JSON.parse(localStorage.getItem("tm_homeworks") || "[]"));
            
            const [activeTab, setActiveTab] = useState("dashboard");
            const [currentMonth, setCurrentMonth] = useState(dayjs());
            const [selectedDate, setSelectedDate] = useState(dayjs());

            // Modals
            const [isAddStudentOpen, setIsAddStudentOpen] = useState(false);
            const [isAddLessonOpen, setIsAddLessonOpen] = useState(false);
            const [isAddHomeworkOpen, setIsAddHomeworkOpen] = useState(false);
            const [editingStudent, setEditingStudent] = useState(null);
            const [isEditStudentOpen, setIsEditStudentOpen] = useState(false);

            // Form States
            const [newStudentName, setNewStudentName] = useState("");
            const [newStudentSubject, setNewStudentSubject] = useState("");
            const [newLessonStudentId, setNewLessonStudentId] = useState("");
            const [newLessonTime, setNewLessonTime] = useState("16:00 - 17:30");
            const [newHomeworkStudentId, setNewHomeworkStudentId] = useState("");
            const [newHomeworkTask, setNewHomeworkTask] = useState("");

            useEffect(() => {
                localStorage.setItem("tm_students", JSON.stringify(students));
                localStorage.setItem("tm_lessons", JSON.stringify(lessons));
                localStorage.setItem("tm_homeworks", JSON.stringify(homeworks));
            }, [students, lessons, homeworks]);

            const getStudent = (id) => students.find(s => s.id === id);
            const lessonsOnDate = (date) => {
                const dateStr = date.format("YYYY-MM-DD");
                return lessons.filter(l => l.date === dateStr);
            };

            const addStudent = () => {
                if (!newStudentName.trim() || !newStudentSubject.trim()) {
                    console.log("Validation failed: Name or Subject is empty");
                    return;
                }
                const colorIdx = students.length % COLORS.length;
                const newStudent = {
                    id: Date.now().toString(),
                    name: newStudentName,
                    subject: newStudentSubject,
                    ...COLORS[colorIdx]
                };
                const updatedStudents = [...students, newStudent];
                setStudents(updatedStudents);
                localStorage.setItem("tm_students", JSON.stringify(updatedStudents));
                
                setNewStudentName("");
                setNewStudentSubject("");
                setIsAddStudentOpen(false);
                console.log("Student added successfully:", newStudent);
            };

            const openEditStudent = (student) => {
                setEditingStudent(student);
                setNewStudentName(student.name);
                setNewStudentSubject(student.subject);
                setIsEditStudentOpen(true);
            };

            const updateStudent = () => {
                if (!editingStudent || !newStudentName.trim() || !newStudentSubject.trim()) return;
                const updatedStudents = students.map(s => s.id === editingStudent.id ? { ...s, name: newStudentName, subject: newStudentSubject } : s);
                setStudents(updatedStudents);
                localStorage.setItem("tm_students", JSON.stringify(updatedStudents));
                
                setEditingStudent(null);
                setNewStudentName("");
                setNewStudentSubject("");
                setIsEditStudentOpen(false);
                console.log("Student updated successfully");
            };

            const addLesson = () => {
                console.log("Attempting to add lesson...", { newLessonStudentId, newLessonTime, selectedDate });
                if (!newLessonStudentId) {
                    alert("학생을 선택해주세요.");
                    return;
                }
                const studentLessons = lessons.filter(l => l.studentId === newLessonStudentId);
                const newLesson = {
                    id: Date.now().toString(),
                    studentId: newLessonStudentId,
                    date: selectedDate.format("YYYY-MM-DD"),
                    time: newLessonTime,
                    sessionCount: studentLessons.length + 1,
                    status: "scheduled"
                };
                const updatedLessons = [...lessons, newLesson];
                setLessons(updatedLessons);
                localStorage.setItem("tm_lessons", JSON.stringify(updatedLessons));
                
                setIsAddLessonOpen(false);
                console.log("Lesson added successfully:", newLesson);
            };

            const completeLesson = (id) => {
                const updatedLessons = lessons.map(l => l.id === id ? { ...l, status: "completed" } : l);
                setLessons(updatedLessons);
                localStorage.setItem("tm_lessons", JSON.stringify(updatedLessons));
            };

            const deleteLesson = (id) => {
                if (confirm("이 수업 일정을 삭제하시겠습니까?")) {
                    const updatedLessons = lessons.filter(l => l.id !== id);
                    setLessons(updatedLessons);
                    localStorage.setItem("tm_lessons", JSON.stringify(updatedLessons));
                }
            };

            const addHomework = () => {
                if (!newHomeworkStudentId || !newHomeworkTask.trim()) return;
                const newHw = {
                    id: Date.now().toString(),
                    studentId: newHomeworkStudentId,
                    task: newHomeworkTask,
                    completed: false,
                    dueDate: dayjs().format("YYYY-MM-DD")
                };
                const updatedHomeworks = [...homeworks, newHw];
                setHomeworks(updatedHomeworks);
                localStorage.setItem("tm_homeworks", JSON.stringify(updatedHomeworks));
                
                setNewHomeworkTask("");
                setIsAddHomeworkOpen(false);
                console.log("Homework added successfully:", newHw);
            };

            const toggleHomework = (id) => {
                const updatedHomeworks = homeworks.map(h => h.id === id ? { ...h, completed: !h.completed } : h);
                setHomeworks(updatedHomeworks);
                localStorage.setItem("tm_homeworks", JSON.stringify(updatedHomeworks));
            };

            const deleteHomework = (id) => {
                const updatedHomeworks = homeworks.filter(h => h.id !== id);
                setHomeworks(updatedHomeworks);
                localStorage.setItem("tm_homeworks", JSON.stringify(updatedHomeworks));
            };

            // --- Renderers ---

            const renderHeader = () => (
                <header className="bg-white border-b border-neutral-200 sticky top-0 z-20">
                    <div className="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-indigo-100">
                                <Icon name="book-open" size={24} />
                            </div>
                            <div>
                                <h1 className="text-xl font-bold tracking-tight text-neutral-900">TutorMate</h1>
                                <p className="text-[10px] uppercase tracking-wider text-neutral-400 font-bold">Management System</p>
                            </div>
                        </div>
                        
                        <nav className="hidden md:flex items-center gap-1 bg-neutral-100 p-1 rounded-xl">
                            {[
                                { id: "dashboard", icon: "layout-dashboard", label: "대시보드" },
                                { id: "calendar", icon: "calendar", label: "캘린더" },
                                { id: "students", icon: "users", label: "학생관리" },
                                { id: "homework", icon: "check-square", label: "숙제관리" },
                            ].map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => setActiveTab(item.id)}
                                    className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all ${
                                        activeTab === item.id 
                                            ? "bg-white text-indigo-600 shadow-sm" 
                                            : "text-neutral-500 hover:text-neutral-900"
                                    }`}
                                >
                                    <Icon name={item.icon} size={18} />
                                    {item.label}
                                </button>
                            ))}
                        </nav>

                        <button 
                            onClick={() => setIsAddStudentOpen(true)}
                            className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 shadow-lg shadow-indigo-100 transition-all active:scale-95"
                        >
                            <Icon name="plus" size={18} />
                            <span className="hidden sm:inline">학생 등록</span>
                        </button>
                    </div>
                </header>
            );

            const renderDashboard = () => {
                const todayLessons = lessonsOnDate(dayjs());
                return (
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 space-y-6">
                            <section>
                                <div className="flex items-center justify-between mb-4">
                                    <h2 className="text-lg font-bold flex items-center gap-2">
                                        <Icon name="clock" className="text-indigo-600" size={20} />
                                        오늘의 수업 ({todayLessons.length})
                                    </h2>
                                    <span className="text-xs font-medium text-neutral-400">{dayjs().format("YYYY년 MM월 DD일")}</span>
                                </div>
                                <div className="space-y-4">
                                    {todayLessons.length > 0 ? todayLessons.map(lesson => {
                                        const student = getStudent(lesson.studentId);
                                        return (
                                            <div key={lesson.id} className={`bg-white p-5 rounded-3xl border-l-4 ${student?.borderColor} shadow-sm flex items-center justify-between`}>
                                                <div className="flex items-center gap-4">
                                                    <div className={`w-12 h-12 rounded-2xl ${student?.color} flex items-center justify-center ${student?.textColor} font-bold text-lg`}>
                                                        {student?.name[0]}
                                                    </div>
                                                    <div>
                                                        <h3 className="font-bold text-neutral-900">{student?.name} 학생</h3>
                                                        <p className="text-sm text-neutral-500 flex items-center gap-1">
                                                            <Icon name="book-open" size={14} /> {student?.subject} • {lesson.time}
                                                        </p>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <Badge className="bg-neutral-100 text-neutral-600">{lesson.sessionCount}회차</Badge>
                                                    {lesson.status === "scheduled" ? (
                                                        <button 
                                                            onClick={() => completeLesson(lesson.id)}
                                                            className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-xl text-xs font-bold transition-all"
                                                        >완료</button>
                                                    ) : (
                                                        <Badge className="bg-emerald-100 text-emerald-700">완료됨</Badge>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    }) : (
                                        <div className="p-12 border-2 border-dashed border-neutral-200 rounded-3xl flex flex-col items-center justify-center text-neutral-400">
                                            <Icon name="calendar" size={48} className="mb-4 opacity-20" />
                                            <p className="font-medium">오늘 예정된 수업이 없습니다.</p>
                                        </div>
                                    )}
                                </div>
                            </section>
                            <section className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div onClick={() => setActiveTab("calendar")} className="bg-indigo-600 text-white p-6 rounded-3xl shadow-lg shadow-indigo-100 cursor-pointer group relative overflow-hidden">
                                    <div className="relative z-10">
                                        <Icon name="calendar-days" className="mb-4" size={24} />
                                        <h3 className="font-bold text-lg">캘린더 보기</h3>
                                        <p className="text-indigo-100 text-xs opacity-80">전체 일정을 관리하세요</p>
                                    </div>
                                    <div className="absolute -right-4 -bottom-4 w-24 h-24 bg-white/10 rounded-full blur-2xl group-hover:scale-150 transition-transform duration-500"></div>
                                </div>
                                <div onClick={() => setIsAddLessonOpen(true)} className="bg-emerald-600 text-white p-6 rounded-3xl shadow-lg shadow-emerald-100 cursor-pointer group relative overflow-hidden">
                                    <div className="relative z-10">
                                        <Icon name="plus" className="mb-4" size={24} />
                                        <h3 className="font-bold text-lg">수업 등록</h3>
                                        <p className="text-emerald-100 text-xs opacity-80">새로운 수업을 추가하세요</p>
                                    </div>
                                    <div className="absolute -right-4 -bottom-4 w-24 h-24 bg-white/10 rounded-full blur-2xl group-hover:scale-150 transition-transform duration-500"></div>
                                </div>
                            </section>
                        </div>
                        <div className="space-y-6">
                            <div className="bg-white p-6 rounded-3xl shadow-sm">
                                <h3 className="text-lg font-bold mb-4">최근 활동</h3>
                                <div className="space-y-4">
                                    {lessons.filter(l => l.status === "completed").slice(-3).reverse().map(l => {
                                        const student = getStudent(l.studentId);
                                        return (
                                            <div key={l.id} className="flex items-center gap-3">
                                                <div className="w-2 h-2 rounded-full bg-emerald-500"></div>
                                                <div className="flex-1">
                                                    <p className="text-sm font-medium">{student?.name} 수업 완료</p>
                                                    <p className="text-[10px] text-neutral-400">{l.date}</p>
                                                </div>
                                            </div>
                                        );
                                    })}
                                    {lessons.filter(l => l.status === "completed").length === 0 && (
                                        <p className="text-sm text-neutral-400 italic">아직 완료된 수업이 없습니다.</p>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderCalendar = () => {
                const startDay = currentMonth.startOf('month').startOf('week');
                const endDay = currentMonth.endOf('month').endOf('week');
                const days = [];
                let day = startDay;
                while (day.isSameOrBefore(endDay)) {
                    days.push(day);
                    day = day.add(1, 'day');
                }

                return (
                    <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
                        <div className="lg:col-span-3 bg-white rounded-3xl shadow-sm overflow-hidden">
                        <div className="p-6 border-b border-neutral-100 flex items-center justify-between">
                                <div className="flex items-center gap-4">
                                    <h2 className="text-2xl font-bold">{currentMonth.format("YYYY년 MM월")}</h2>
                                    <div className="flex items-center gap-1 bg-neutral-100 p-1 rounded-xl">
                                        <button onClick={() => setCurrentMonth(currentMonth.subtract(1, 'month'))} className="p-1.5 hover:bg-white rounded-lg transition-all"><Icon name="chevron-left" size={18} /></button>
                                        <button onClick={() => setCurrentMonth(dayjs())} className="px-3 py-1 text-xs font-bold hover:bg-white rounded-lg transition-all">오늘</button>
                                        <button onClick={() => setCurrentMonth(currentMonth.add(1, 'month'))} className="p-1.5 hover:bg-white rounded-lg transition-all"><Icon name="chevron-right" size={18} /></button>
                                    </div>
                                </div>
                                <button onClick={() => setIsAddLessonOpen(true)} className="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition-all active:scale-95">
                                    <Icon name="plus" size={18} /> 수업 추가
                                </button>
                            </div>
                            <div className="calendar-grid border-b border-neutral-100">
                                {["일", "월", "화", "수", "목", "금", "토"].map((d, i) => (
                                    <div key={d} className={`py-3 text-center text-[10px] font-bold uppercase tracking-widest ${i === 0 ? 'text-red-400' : i === 6 ? 'text-blue-400' : 'text-neutral-400'}`}>{d}</div>
                                ))}
                            </div>
                            <div className="calendar-grid">
                                {days.map((d, i) => {
                                    const dayLessons = lessonsOnDate(d);
                                    const isCurrentMonth = d.isSame(currentMonth, 'month');
                                    const isSelected = d.isSame(selectedDate, 'day');
                                    const isToday = d.isToday();
                                    return (
                                        <div 
                                            key={d.toString()} 
                                            onClick={() => setSelectedDate(d)}
                                            className={`min-h-[100px] p-1 border-r border-b border-neutral-50 transition-colors cursor-pointer hover:bg-neutral-50/50 ${!isCurrentMonth ? 'opacity-30 bg-neutral-50/30' : ''} ${isSelected ? 'bg-indigo-50/30' : ''}`}
                                        >
                                            <div className="flex justify-between items-start mb-1">
                                                <span className={`text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full ${isToday ? 'bg-indigo-600 text-white' : i % 7 === 0 ? 'text-red-500' : i % 7 === 6 ? 'text-blue-500' : 'text-neutral-500'}`}>{d.date()}</span>
                                            </div>
                                            <div className="space-y-1">
                                                {dayLessons.map(l => {
                                                    const s = getStudent(l.studentId);
                                                    return <div key={l.id} className={`px-1 py-0.5 rounded text-[8px] font-bold truncate ${s?.color} ${s?.textColor} border ${s?.borderColor}`}>{s?.name}</div>
                                                })}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                        <div className="space-y-6">
                            <div className="bg-white p-6 rounded-3xl shadow-sm">
                                <h3 className="text-lg font-bold mb-4">{selectedDate.format("M월 D일")} 일정</h3>
                                <div className="space-y-3">
                                    {lessonsOnDate(selectedDate).map(l => {
                                        const s = getStudent(l.studentId);
                                        return (
                                            <div key={l.id} className="p-3 bg-neutral-50 rounded-2xl border border-neutral-100">
                                                <div className="flex justify-between items-start mb-2">
                                                    <p className="font-bold text-sm">{s?.name} ({s?.subject})</p>
                                                    <button onClick={() => deleteLesson(l.id)} className="text-neutral-300 hover:text-red-500 transition-colors"><Icon name="trash-2" size={14} /></button>
                                                </div>
                                                <p className="text-xs text-neutral-500 flex items-center gap-1 mb-2"><Icon name="clock" size={12} /> {l.time}</p>
                                                <div className="flex items-center justify-between">
                                                    <Badge className="bg-white border border-neutral-200 text-neutral-500">{l.sessionCount}회차</Badge>
                                                    {l.status === "scheduled" && <button onClick={() => completeLesson(l.id)} className="text-[10px] font-bold text-indigo-600 hover:underline">완료처리</button>}
                                                </div>
                                            </div>
                                        );
                                    })}
                                    {lessonsOnDate(selectedDate).length === 0 && <p className="text-sm text-neutral-400 italic text-center py-4">일정이 없습니다.</p>}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderStudents = () => (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {students.map(s => {
                        const studentLessons = lessons.filter(l => l.studentId === s.id);
                        const completedCount = studentLessons.filter(l => l.status === "completed").length;
                        return (
                            <div key={s.id} className="bg-white rounded-3xl shadow-sm overflow-hidden group">
                                <div className={`h-2 ${s.color}`}></div>
                                <div className="p-6">
                                    <div className="flex items-center justify-between mb-4">
                                        <div className={`w-12 h-12 rounded-2xl ${s.color} flex items-center justify-center ${s.textColor} font-bold text-xl`}>{s.name[0]}</div>
                                        <div className="flex items-center gap-2">
                                            <button onClick={() => openEditStudent(s)} className="text-neutral-300 hover:text-indigo-600 transition-colors"><Icon name="edit-2" size={18} /></button>
                                            <button onClick={() => confirm(`${s.name} 학생을 삭제하시겠습니까?`) && setStudents(students.filter(st => st.id !== s.id))} className="text-neutral-300 hover:text-red-500 transition-colors"><Icon name="trash-2" size={18} /></button>
                                        </div>
                                    </div>
                                    <h3 className="font-bold text-lg">{s.name}</h3>
                                    <p className="text-sm text-neutral-500 mb-6">{s.subject}</p>
                                    <div className="space-y-2">
                                        <div className="flex justify-between text-[10px] font-bold uppercase tracking-wider text-neutral-400">
                                            <span>진행 회차</span>
                                            <span className="text-neutral-900">{completedCount}회 완료</span>
                                        </div>
                                        <div className="h-1.5 w-full bg-neutral-100 rounded-full overflow-hidden">
                                            <div className={`h-full rounded-full ${s.color.replace('100', '500')}`} style={{ width: `${Math.min(100, (completedCount / 8) * 100)}%` }}></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    })}
                    {students.length === 0 && (
                        <div className="col-span-full py-20 text-center text-neutral-400 border-2 border-dashed border-neutral-200 rounded-3xl">
                            <Icon name="users" size={48} className="mx-auto mb-4 opacity-20" />
                            <p className="font-medium">등록된 학생이 없습니다.</p>
                        </div>
                    )}
                </div>
            );

            const renderHomework = () => (
                <div className="space-y-6">
                    <div className="flex items-center justify-between mb-4">
                        <h2 className="text-xl font-bold flex items-center gap-2"><Icon name="check-square" className="text-indigo-600" size={24} /> 숙제 관리</h2>
                        <button onClick={() => setIsAddHomeworkOpen(true)} className="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition-all active:scale-95">
                            <Icon name="plus" size={18} /> 숙제 추가
                        </button>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {students.map(s => {
                            const studentHomeworks = homeworks.filter(h => h.studentId === s.id);
                            if (studentHomeworks.length === 0) return null;
                            return (
                                <div key={s.id} className="bg-white rounded-3xl shadow-sm overflow-hidden">
                                    <div className={`${s.color} px-6 py-4 border-b ${s.borderColor}`}>
                                        <h3 className={`font-bold text-sm ${s.textColor}`}>{s.name} 학생 숙제</h3>
                                    </div>
                                    <div className="p-4 space-y-3">
                                        {studentHomeworks.map(hw => (
                                            <div key={hw.id} className="flex items-center justify-between p-2 hover:bg-neutral-50 rounded-xl transition-colors">
                                                <div className="flex items-center gap-3">
                                                    <input type="checkbox" checked={hw.completed} onChange={() => toggleHomework(hw.id)} className="w-4 h-4 rounded border-neutral-300 text-indigo-600 focus:ring-indigo-500" />
                                                    <span className={`text-sm ${hw.completed ? 'line-through text-neutral-400' : 'text-neutral-700'}`}>{hw.task}</span>
                                                </div>
                                                <button onClick={() => deleteHomework(hw.id)} className="text-neutral-200 hover:text-red-500 transition-colors"><Icon name="trash-2" size={14} /></button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            );
                        })}
                        {homeworks.length === 0 && (
                            <div className="col-span-full py-20 text-center text-neutral-400 border-2 border-dashed border-neutral-200 rounded-3xl">
                                <Icon name="check-square" size={48} className="mx-auto mb-4 opacity-20" />
                                <p className="font-medium">등록된 숙제가 없습니다.</p>
                            </div>
                        )}
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen pb-20 md:pb-0">
                    {renderHeader()}
                    <main className="max-w-6xl mx-auto p-6">
                        {activeTab === "dashboard" && renderDashboard()}
                        {activeTab === "calendar" && renderCalendar()}
                        {activeTab === "students" && renderStudents()}
                        {activeTab === "homework" && renderHomework()}
                    </main>

                    {/* Mobile Navigation */}
                    <footer className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-neutral-200 px-6 py-3 flex justify-around items-center z-30">
                        {[
                            { id: "dashboard", icon: "layout-dashboard" },
                            { id: "calendar", icon: "calendar" },
                            { id: "students", icon: "users" },
                            { id: "homework", icon: "check-square" },
                        ].map(item => (
                            <button key={item.id} onClick={() => setActiveTab(item.id)} className={`p-2 rounded-xl transition-all ${activeTab === item.id ? 'bg-indigo-50 text-indigo-600' : 'text-neutral-400'}`}>
                                <Icon name={item.icon} size={24} />
                            </button>
                        ))}
                    </footer>

                    {/* Modals */}
                    <Modal isOpen={isAddStudentOpen} onClose={() => setIsAddStudentOpen(false)} title="새 학생 등록" footer={<button onClick={addStudent} disabled={!newStudentName.trim() || !newStudentSubject.trim()} className="w-full bg-indigo-600 disabled:bg-neutral-200 text-white py-2.5 rounded-xl font-bold">저장하기</button>}>
                        <div className="space-y-4">
                            <div className="space-y-1">
                                <label className="text-xs font-bold text-neutral-400 uppercase tracking-wider">학생 이름</label>
                                <input value={newStudentName} onChange={e => setNewStudentName(e.target.value)} placeholder="예: 김민수" className="w-full px-4 py-2 rounded-xl border border-neutral-200 focus:ring-2 focus:ring-indigo-500 outline-none" />
                            </div>
                            <div className="space-y-1">
                                <label className="text-xs font-bold text-neutral-400 uppercase tracking-wider">수업 과목</label>
                                <input value={newStudentSubject} onChange={e => setNewStudentSubject(e.target.value)} placeholder="예: 고등 수학 (상)" className="w-full px-4 py-2 rounded-xl border border-neutral-200 focus:ring-2 focus:ring-indigo-500 outline-none" />
                            </div>
                        </div>
                    </Modal>

                    <Modal isOpen={isEditStudentOpen} onClose={() => setIsEditStudentOpen(false)} title="학생 정보 수정" footer={<button onClick={updateStudent} disabled={!newStudentName.trim() || !newStudentSubject.trim()} className="w-full bg-indigo-600 disabled:bg-neutral-200 text-white py-2.5 rounded-xl font-bold">저장하기</button>}>
                        <div className="space-y-4">
                            <div className="space-y-1">
                                <label className="text-xs font-bold text-neutral-400 uppercase tracking-wider">학생 이름</label>
                                <input value={newStudentName} onChange={e => setNewStudentName(e.target.value)} placeholder="예: 김민수" className="w-full px-4 py-2 rounded-xl border border-neutral-200 focus:ring-2 focus:ring-indigo-500 outline-none" />
                            </div>
                            <div className="space-y-1">
                                <label className="text-xs font-bold text-neutral-400 uppercase tracking-wider">수업 과목</label>
                                <input value={newStudentSubject} onChange={e => setNewStudentSubject(e.target.value)} placeholder="예: 고등 수학 (상)" className="w-full px-4 py-2 rounded-xl border border-neutral-200 focus:ring-2 focus:ring-indigo-500 outline-none" />
                            </div>
                        </div>
                    </Modal>

                    <Modal isOpen={isAddLessonOpen} onClose={() => setIsAddLessonOpen(false)} title="수업 일정 추가" footer={<button onClick={addLesson} disabled={!newLessonStudentId || !newLessonTime.trim()} className="w-full bg-indigo-600 disabled:bg-neutral-200 text-white py-2.5 rounded-xl font-bold">저장하기</button>}>
                        <div className="space-y-4">
                            <div className="space-y-1">
                                <label className="text-xs font-bold text-neutral-400 uppercase tracking-wider">학생 선택</label>
                                <select value={newLessonStudentId} onChange={e => setNewLessonStudentId(e.target.value)} className="w-full px-4 py-2 rounded-xl border border-neutral-200 outline-none">
                                    <option value="">학생을 선택하세요</option>
                                    {students.map(s => <option key={s.id} value={s.id}>{s.name} ({s.subject})</option>)}
                                </select>
                            </div>
                            <div className="space-y-1">
                                <label className="text-xs font-bold text-neutral-400 uppercase tracking-wider">수업 날짜</label>
                                <input type="date" value={selectedDate.format("YYYY-MM-DD")} onChange={e => setSelectedDate(dayjs(e.target.value))} className="w-full px-4 py-2 rounded-xl border border-neutral-200 outline-none" />
                            </div>
                            <div className="space-y-1">
                                <label className="text-xs font-bold text-neutral-400 uppercase tracking-wider">수업 시간</label>
                                <input value={newLessonTime} onChange={e => setNewLessonTime(e.target.value)} placeholder="예: 16:00 - 17:30" className="w-full px-4 py-2 rounded-xl border border-neutral-200 outline-none" />
                            </div>
                        </div>
                    </Modal>

                    <Modal isOpen={isAddHomeworkOpen} onClose={() => setIsAddHomeworkOpen(false)} title="새 숙제 추가" footer={<button onClick={addHomework} disabled={!newHomeworkStudentId || !newHomeworkTask.trim()} className="w-full bg-indigo-600 disabled:bg-neutral-200 text-white py-2.5 rounded-xl font-bold">저장하기</button>}>
                        <div className="space-y-4">
                            <div className="space-y-1">
                                <label className="text-xs font-bold text-neutral-400 uppercase tracking-wider">학생 선택</label>
                                <select value={newHomeworkStudentId} onChange={e => setNewHomeworkStudentId(e.target.value)} className="w-full px-4 py-2 rounded-xl border border-neutral-200 outline-none">
                                    <option value="">학생을 선택하세요</option>
                                    {students.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                </select>
                            </div>
                            <div className="space-y-1">
                                <label className="text-xs font-bold text-neutral-400 uppercase tracking-wider">숙제 내용</label>
                                <input value={newHomeworkTask} onChange={e => setNewHomeworkTask(e.target.value)} placeholder="예: 수학 익힘책 10-15p 풀기" className="w-full px-4 py-2 rounded-xl border border-neutral-200 outline-none" />
                            </div>
                        </div>
                    </Modal>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
